user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend {
        server ruoyi-admin:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. 若依运营管理端 (ruoyi-ui)
        location / {
            root /usr/share/nginx/html/ruoyi-ui;
            try_files $uri $uri/ /index.html;
            index index.html;
        }

        # 2. 现场大屏端 (gamescreen-wall)
        location /wall/ {
            alias /usr/share/nginx/html/gamescreen-wall/;
            try_files $uri $uri/ /wall/index.html;
            index index.html;
        }

        # 3. 手机观众端 (gamescreen-h5)
        location /h5/ {
            alias /usr/share/nginx/html/gamescreen-h5/;
            try_files $uri $uri/ /h5/index.html;
            index index.html;
        }

        # 4. 后端接口反向代理 (REST API)
        location ~ ^/(prod-api|gamescreen|gs|login|register|captchaImage|profile)/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # 5. SSE 长连接 (大屏流推送)
        location /gs/screen/stream {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
        }

        # 6. WebSocket 反向代理
        location /gs/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }
    }
}
