# 学情分析业务配置
spas:
  student:
    username-use-student-no: true
    init-password: "123456"
    force-reset-pwd: false
  paper:
    allow-change-knowledge-after-score: false
    # 发布/导入成绩时是否强制题型、Bloom（false=仅软提示，true=硬拦截）
    # P0：题型 + Bloom 默认硬门禁，避免题型/能力层分析空转（试点可临时改 false）
    require-question-type: true
    require-bloom-level: true
  score:
    # 导入时空单元格跳过、不计入样本（true 则按 0 分计入）
    blank-as-zero: false
    # 得分率小数位
    rate-scale: 6
  qb:
    ocr:
      max-pages: ${SPAS_QB_OCR_MAX_PAGES:30}
      dpi: ${SPAS_QB_OCR_DPI:220}
      session-ttl-hours: ${SPAS_QB_OCR_TTL_HOURS:24}
    ai:
      # false=本地启发式；true 且配置 api-key 时走 DeepSeek（OpenAI 兼容）
      enabled: ${SPAS_QB_AI_ENABLED:false}
      endpoint: ${SPAS_QB_AI_ENDPOINT:https://api.deepseek.com/v1/chat/completions}
      api-key: ${SPAS_QB_AI_API_KEY:}
      model: ${SPAS_QB_AI_MODEL:deepseek-chat}
      timeout-ms: 30000
      top-k: 5
  analysis:
    # Time window: all | last30d | last90d | semester
    # P2 E7: 分析默认本学期，降低旧考试对结论的干扰
    default-window: semester
    # semester start as MM-dd or yyyy-MM-dd
    semester-start: "09-01"
    # D3: 上学期闭区间 [start, end)。空则按 semester-start 自动推算：
    # 秋学期(>=8月) → 上学期 当年-02-15 ~ 当年-09-01；春学期 → 上年-09-01 ~ 当年 semester-start
    # 也可写死：prev-semester-start: "2026-02-15" / prev-semester-end: "2026-09-01"
    prev-semester-start: ""
    prev-semester-end: ""
    # 近因半衰期（天）：越近考试权重越高；0=关闭近因加权；重算时可临时覆盖
    recency-half-life-days: 60
    # 近因锚定：today=查询当日；max-exam=样本内最晚考试日；semester-end=当前学期末日（期内稳定）
    recency-anchor: semester-end
    # 选卷诊断一次最多试卷数
    scope-max-papers: 30
    # 反复薄弱判定
    persistent-weak:
      min-papers: 3
      rate-threshold: 0.60
      persist-ratio: 0.67
    # 得分率小数位（快照）
    rate-scale: 6
    difficulty-weight:
      easy: 1.0
      medium: 1.2
      hard: 1.5
      # 用班级实测通过率校正标签难度（样本够时混合）
      empirical-enabled: true
      empirical-min-students: 8
      empirical-blend: 0.5
      empirical-easy-rate: 0.80
      empirical-hard-rate: 0.40
    # 一题多点分摊：proportional=按权重分摊（默认）；primary-full=主知识点全额计入掌握，辅点只计曝光次数
    allocation-mode: proportional
    # 班级相对薄弱：本人得分率低于班均超过 delta 时打标
    relative-weak:
      enabled: true
      delta: 0.10
    # 分科阈值覆盖（key=subjectCode）；未配置的学科走 weak-thresholds
    # MATH：计算步骤多、易粗心，略抬高警戒/薄弱线；PHYS：实验/概念题波动大，略放宽样本门槛
    subject-overrides:
      MATH:
        watch: 0.80
        weak: 0.65
        severe: 0.50
        min-attempts: 3
        severe-min-attempts: 3
      PHYS:
        watch: 0.75
        weak: 0.60
        severe: 0.45
        min-attempts: 2
        severe-min-attempts: 3
      CHN:
        watch: 0.78
        weak: 0.62
        severe: 0.48
        min-attempts: 3
        severe-min-attempts: 3
      ENG:
        watch: 0.80
        weak: 0.65
        severe: 0.50
        min-attempts: 3
        severe-min-attempts: 3
      CHEM:
        watch: 0.75
        weak: 0.60
        severe: 0.45
        min-attempts: 2
        severe-min-attempts: 3
    weak-thresholds:
      watch: 0.75
      weak: 0.60
      severe: 0.45
      min-attempts: 3
      # 严重等级也要求达到最低练习次数，避免样本过少误判
      severe-min-attempts: 3
      # 考查频次 × 掌握度交叉（优先干预象限）
    priority:
      question-min: 2
      weak-rate: 0.60
      solid-rate: 0.75
      # 置信度展示：attempt < mid → 样本不足；mid~high → 中；>= high → 高
      attempt-mid: 3
      attempt-high: 6
    # 选卷/时间窗口径：未标注题目占比过高时自动降置信度并禁止正式定级
    annotation-coverage:
      unbound-ratio-threshold: 0.20
      force-insufficient: true
      confidence-multiplier: 0.5
      # true=对本学期等时间窗内试卷同样做覆盖率门禁（不仅选卷）
      apply-on-window: true
    # D4 Bloom 叙事阈值（薄弱线默认跟 weak-thresholds.weak）
    bloom-insight:
      # 基础层低于此且高阶不低于 weak → 「基础偏弱」
      # 未单独配置时与 weak-thresholds.weak 对齐（见 Java 默认值）
      foundation-solid: 0.70
      gap: 0.15
  intervene:
    auto-evaluate-after-recalc: true
    # Large class import/recalc: evaluate open intervene tasks off the request thread
    async-evaluate: true
    default-target-rate: 0.60
    # Prefer post-create attempts when measuring effect (fallback to full snapshot if none)
    effect-after-create: true
    # Auto-close source warning when intervene reaches target
    close-warning-on-pass: true
  report:
    # Optional absolute path override; otherwise classpath fonts/spas-cjk.otf then OS fonts
    pdf-font-path:
  warning:
    # Extra notify channels beyond system notice. Rule.notifyChannels may include "webhook".
    # Empty webhook-url = skip. Body JSON: {ruleName, level, content, studentId, metricValue}
    webhook-url: ${SPAS_WARNING_WEBHOOK_URL:}
    webhook-timeout-ms: 5000
  open:
    # Parent OpenAPI master switch (see docs/spas-open-api.md).
    # Production: keep false until parent client + secrets are ready; enable only in staging/integration.
    # After flipping enabled, restart backend. Admin UI /spas/open shows runtime status banner.
    # Product boundary: API-only parent access (no official H5/App yet; N7 deferred).
    enabled: false
    token-ttl-minutes: 120
    # Audit log all authenticated OpenAPI calls (SPAS_OPEN_AUDIT)
    audit-log: true

ruoyi:
  # 名称
  name: 知脉
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /Users/maoming/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 30MB
      # 设置总上传的文件大小
      max-request-size: 40MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/spas/warning/rule
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/spas/*
