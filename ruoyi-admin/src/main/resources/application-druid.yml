# 数据源配置
# 生产请用环境变量覆盖，勿把真实密码提交仓库：
#   SPAS_DB_URL / SPAS_DB_USER / SPAS_DB_PASSWORD
#   SPAS_DRUID_USER / SPAS_DRUID_PASSWORD（控制台账号；生产建议关闭或仅本机）
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: org.postgresql.Driver
        druid:
            # 主库数据源
            master:
                url: ${SPAS_DB_URL:jdbc:postgresql://localhost:5432/spas-sql?stringtype=unspecified&TimeZone=Asia/Shanghai}
                username: ${SPAS_DB_USER:postgres}
                password: ${SPAS_DB_PASSWORD:}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 生产建议 false；本地调试可 SPAS_DRUID_STAT_ENABLED=true
                enabled: ${SPAS_DRUID_STAT_ENABLED:false}
                # 仅本机；勿留空（空=允许全部）
                allow: ${SPAS_DRUID_ALLOW:127.0.0.1}
                url-pattern: /druid/*
                login-username: ${SPAS_DRUID_USER:ruoyi}
                login-password: ${SPAS_DRUID_PASSWORD:}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
